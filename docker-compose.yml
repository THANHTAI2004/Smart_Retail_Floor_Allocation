services:
  database:
    image: mongo:8.0
    command: ["mongod", "--auth", "--bind_ip_all"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_ROOT_USER:?Set private MONGODB_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_ROOT_PASSWORD:?Set private MONGODB_ROOT_PASSWORD}
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --username $$MONGO_INITDB_ROOT_USERNAME --password $$MONGO_INITDB_ROOT_PASSWORD --authenticationDatabase admin --eval 'quit(db.adminCommand({ping:1}).ok ? 0 : 1)'"]
      interval: 3s
      timeout: 5s
      retries: 30
  initialize:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment: &backend-env
      MONGODB_URI: ${MONGODB_URI:?Set private authenticated MONGODB_URI using database hostname and authSource=admin}
      MONGODB_DATABASE: ${MONGODB_DATABASE:-smart_retail}
      SMART_RETAIL_ARTIFACTS: /app/var/artifacts
    command: ["python", "-m", "smart_retail.infrastructure.mongodb.health"]
    depends_on:
      database:
        condition: service_healthy
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment: *backend-env
    ports: ["127.0.0.1:8010:8000"]
    volumes: ["run_artifacts:/app/var/artifacts", "research_campaigns:/app/var/research"]
    depends_on:
      initialize:
        condition: service_completed_successfully
  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment: *backend-env
    command: ["python", "-m", "smart_retail.workers.runner"]
    volumes: ["run_artifacts:/app/var/artifacts"]
    depends_on:
      initialize:
        condition: service_completed_successfully
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports: ["127.0.0.1:5173:80"]
    depends_on: [backend]
volumes:
  mongodb_data:
  run_artifacts:
  research_campaigns:
