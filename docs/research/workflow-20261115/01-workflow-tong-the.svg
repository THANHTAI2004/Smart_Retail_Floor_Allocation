   <g id="text_1">
    <text style="font-weight: 700; font-size: 21px; font-family: 'Arial'; text-anchor: middle; fill: #25354a" x="369.9" y="37.032206" transform="rotate(-0 369.9 37.032206)">WORKFLOW TỔNG THỂ CỦA HỆ THỐNG</text>
   </g>
   <g id="text_2">
    <text style="font-size: 11px; font-family: 'Arial'; text-anchor: middle; fill: #59687b" x="369.9" y="45.889269" transform="rotate(-0 369.9 45.889269)">Ứng dụng hiện tại • phân biệt luồng thông thường và các chế độ tối ưu joint</text>
   </g>
   <g id="text_3">
    <text style="font-size: 12px; font-family: 'Arial'; fill: #25354a" transform="translate(237.809062 75.759715)">Nhập dữ liệu qua UI/API hoặc cấu hình campaign</text>
    <text style="font-size: 12px; font-family: 'Arial'; fill: #25354a" transform="translate(256.5525 90.963035)">Xác thực hợp đồng và tham chiếu đầu vào</text>
   </g>
   <g id="text_4">
    <text style="font-size: 12px; font-family: 'Arial'; fill: #25354a" transform="translate(211.461562 155.038915)">Chốt snapshot + checksum + nhận diện nguồn/dependency</text>
    <text style="font-size: 12px; font-family: 'Arial'; fill: #25354a" transform="translate(219.143437 170.242235)">Đưa job vào durable queue → worker chạy tiến trình con</text>
   </g>
   <g id="text_5">
    <text style="font-size: 12px; font-family: 'Arial'; fill: #25354a" transform="translate(228.514687 237.921715)">Nếu có đánh giá ngoài mẫu: tách dữ liệu trước tối ưu</text>
    <text style="font-size: 12px; font-family: 'Arial'; fill: #25354a" transform="translate(219.109687 253.125035)">Giữ phần đánh giá riêng; chỉ tối ưu trên phần huấn luyện</text>
   </g>
   <g id="text_6">
    <text style="font-size: 12px; font-family: 'Arial'; text-anchor: middle; fill: #25354a" x="369.9" y="327.4218" transform="rotate(-0 369.9 327.4218)">Chọn workflow theo optimization.joint</text>
   </g>
   <g id="text_7">
    <text style="font-size: 12px; font-family: 'Arial'; fill: #25354a" transform="translate(154.11225 416.255295)">joint = null</text>
    <text style="font-size: 12px; font-family: 'Arial'; fill: #25354a" transform="translate(107.375062 432.516115)">Luồng T1 → T2 → T3 → T4</text>
    <text style="font-size: 12px; font-family: 'Arial'; fill: #25354a" transform="translate(115.242562 447.719435)">Một hoặc nhiều ứng viên</text>
    <text style="font-size: 12px; font-family: 'Arial'; fill: #25354a" transform="translate(113.320687 462.949943)">Chọn theo điểm tổng hợp</text>
   </g>
   <g id="text_8">
    <text style="font-size: 11px; font-family: 'Arial'; fill: #25354a" transform="translate(511.163609 418.872428)">joint được cấu hình</text>
    <text style="font-size: 11px; font-family: 'Arial'; fill: #25354a" transform="translate(463.743297 431.970915)">sequential / multistart / random_search</text>
    <text style="font-size: 11px; font-family: 'Arial'; fill: #25354a" transform="translate(485.427906 445.842838)">annealing / genetic / feedback</text>
    <text style="font-size: 11px; font-family: 'Arial'; fill: #25354a" transform="translate(525.796187 459.779215)">exact / hybrid</text>
   </g>
   <g id="text_9">
    <text style="font-size: 12px; font-family: 'Arial'; fill: #25354a" transform="translate(247.81125 562.245715)">Nếu có tập giữ lại: cố định quyết định đã chọn</text>
    <text style="font-size: 12px; font-family: 'Arial'; fill: #25354a" transform="translate(208.644375 577.476223)">Mô phỏng + replay → điểm ngoài mẫu và trạng thái đánh giá</text>
   </g>
   <g id="text_10">
    <text style="font-size: 12px; font-family: 'Arial'; fill: #25354a" transform="translate(241.829062 655.939315)">Lưu kết quả / lỗi / trạng thái / receipt / checksum</text>
    <text style="font-size: 12px; font-family: 'Arial'; fill: #25354a" transform="translate(222.864375 671.169823)">Đọc trên giao diện hoặc tổng hợp báo cáo thực nghiệm</text>
   </g>
   <g id="text_11">
    <text style="font-size: 10px; font-family: 'Arial'; text-anchor: middle; fill: #59687b" x="369.9" y="717.1092" transform="rotate(-0 369.9 717.1092)">Dữ liệu mẫu small_store: joint=null. Sơ đồ feedback_v5 ở hình riêng là một nhánh của hệ thống.</text>
   </g>
  </g>
