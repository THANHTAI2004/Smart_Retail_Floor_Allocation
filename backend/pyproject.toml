[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-retail"
version = "0.1.0"
description = "Retail layout research platform"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.157.0", "uvicorn>=0.34,<1", "pydantic==2.14.1",
  "pymongo==4.18.2",
  "shapely>=2.1,<3", "numpy>=2.2,<3", "scipy>=1.15,<2",
  "networkx>=3.4,<4", "simpy>=4.1,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "hypothesis>=6,<7", "httpx>=0.28,<1", "ruff>=0.11,<1", "mypy>=1.15,<2", "types-networkx"]
research = ["matplotlib>=3.10,<4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
junit_family = "legacy"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["smart_retail"]

[tool.mypy]
python_version = "3.12"
incremental = false
cache_dir = "nul"
check_untyped_defs = true
ignore_missing_imports = true
disable_error_code = ["import-untyped"]

